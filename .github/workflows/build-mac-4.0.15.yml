# 一次性构建：v4.0.15 macOS universal 安装包（fork 无签名私钥，出产物供手动下载安装）。
# 仅 workflow_dispatch 触发，不碰 tag、不建 Release（tag 与 release 由 Windows 侧 gh 完成）。
# dmg 取回后本文件可删。
name: Build macOS 4.0.15 (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac:
    name: Build universal dmg
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # 钉 1.95：rust-toolchain.toml 的 channel="1.95"。dtolnay/rust-toolchain 会把
      # "1.95" 解析成 "1.95.0" 并以 --force-non-host 安装，而 cargo 按 toml 解析到
      # 名为 "1.95" 的工具链、自动装成仅宿主版，x86_64 缺失导致 universal 构建失败。
      # 改为显式安装同名 1.95 工具链并给它补两个 Apple targets（与 toml 完全对齐）。
      - name: Setup Rust (pinned 1.95 + Apple targets)
        run: |
          cd src-tauri
          rustup toolchain install 1.95 --profile minimal -c rustfmt -c clippy
          rustup target add aarch64-apple-darwin x86_64-apple-darwin --toolchain 1.95
          echo "--- active toolchain (src-tauri) ---"
          rustup show active-toolchain
          echo "--- 1.95 installed targets ---"
          rustup target list --toolchain 1.95 --installed

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 与 v4.0.14 一致：关 updater 产物（本机无签名私钥），只出 app + dmg
      - name: Build universal app + dmg
        run: |
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg \
            -c '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Rename dmg (no spaces)
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle/dmg
          mv "CC-Switch_4.0.15_universal.dmg" "CC-Switch-v4.0.15-macOS.dmg"
          ls -l CC-Switch-v4.0.15-macOS.dmg
          shasum -a 256 CC-Switch-v4.0.15-macOS.dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-v4.0.15-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/CC-Switch-v4.0.15-macOS.dmg
          retention-days: 14
