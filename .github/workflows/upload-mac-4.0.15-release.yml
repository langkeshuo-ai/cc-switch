# 一次性：从 run 39089692131 的 artifact 取回 macOS dmg 并直传 v4.0.15 release。
# 背景：本机（Windows）下载 33MB artifact 走 GitHub CDN 不通，改由 runner 侧完成大文件传输；
# 本机只上行两个小体积 Windows 产物。完成后可与本文件一起删。
name: Upload 4.0.15 dmg to release (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  upload:
    name: Fetch artifact and upload to release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download dmg artifact from build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download 39089692131 --repo langkeshuo-ai/cc-switch \
            -n cc-switch-v4.0.15-macos -D ./dmg
          ls -l ./dmg

      - name: Verify SHA256 (must match build run output)
        run: |
          cd dmg
          echo "9804919e5ad4f1a68830fd1b87a095a2f2356c011cb423f87ea442d8fa4a56bb  CC-Switch-v4.0.15-macOS.dmg" | sha256sum -c -

      - name: Upload dmg to v4.0.15 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v4.0.15 ./dmg/CC-Switch-v4.0.15-macOS.dmg \
            --repo langkeshuo-ai/cc-switch --clobber
          gh release view v4.0.15 --repo langkeshuo-ai/cc-switch --json assets --jq '.assets[].name'
